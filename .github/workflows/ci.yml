name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 20.12 is the floor the plugin declares; 22 is current LTS.
        node: ["20.12", "22"]
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: |
          npm run build:server
          npm run build:allowance

  cleanroom:
    name: Clean room (empty HOME)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Proves a pass cannot depend on the contributor's own OpenCode config,
      # credentials or installed plugin.
      - name: Verify
        run: npm run verify

  mutations:
    name: Mutation harness
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Reverts each safety property in turn and fails if the suite still passes.
      # This is the only check that proves the tests guard anything.
      - name: Mutate
        run: npm run mutate

  host-survival:
    name: Host survival (real OpenCode)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install OpenCode V2
        run: |
          # The plugin targets the OpenCode V2 API. The `opencode.ai/install`
          # script installs OpenCode 1, whose CLI has no `--standalone` flag and
          # whose hook surface differs, so it would test the wrong program and
          # pass or fail for reasons unrelated to this plugin.
          #
          # V2 is not on Homebrew here: `brew` does not exist on Ubuntu runners,
          # which is why the first version of this job failed in 13 seconds. The
          # release publishes Linux binaries directly, so install from those and
          # verify the checksum rather than trusting the download.
          set -euo pipefail
          VERSION="2.2.6"
          ASSET="opencode-linux-x64-baseline.tar.gz"
          BASE="https://github.com/anomalyco/opencode/releases/download/v${VERSION}"
          curl -fsSL "$BASE/$ASSET" -o /tmp/opencode.tar.gz
          curl -fsSL "$BASE/SHA256SUMS" -o /tmp/SHA256SUMS
          expected="$(grep " $ASSET$" /tmp/SHA256SUMS | awk '{print $1}')"
          actual="$(sha256sum /tmp/opencode.tar.gz | awk '{print $1}')"
          if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
            echo "FATAL: checksum mismatch for $ASSET" >&2
            echo "  expected: ${expected:-missing}" >&2
            echo "  actual:   $actual" >&2
            exit 1
          fi
          mkdir -p "$HOME/.opencode-v2/bin"
          tar -xzf /tmp/opencode.tar.gz -C "$HOME/.opencode-v2/bin" opencode
          chmod +x "$HOME/.opencode-v2/bin/opencode"
          echo "$HOME/.opencode-v2/bin" >> "$GITHUB_PATH"
          "$HOME/.opencode-v2/bin/opencode" --version
      - name: Require OpenCode V2
        run: |
          # The CLI prints "opencode v2.2.6", so extract the dotted version
          # rather than assuming a bare number.
          v="$(opencode --version 2>/dev/null | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          major="${v%%.*}"
          if [ "$major" != "2" ]; then
            echo "FATAL: this suite needs OpenCode 2.x, found '${v:-unknown}'" >&2
            exit 1
          fi
      - name: Build the bundle under test
        run: npm run build:server
      # Unit tests call functions. This runs the plugin inside a real OpenCode
      # process in a throwaway HOME and asserts only that OpenCode still answers
      # a prompt when the plugin is broken. It is the check whose absence let
      # 0.6.0 disable the editor while 801 tests passed.
      #
      # The model is a loopback stub started by the script itself, so the run
      # needs no credentials, spends nothing, and cannot be blocked by provider
      # quota. Nothing about the guarantee depends on a third party being up.
      - name: Run the isolated suite
        run: ./scripts/isolated-e2e.sh --timeout 240
