name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 20.12 is the floor the plugin declares; 22 is current LTS.
        node: ["20.12", "22"]
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: |
          npm run build:server
          npm run build:allowance

  cleanroom:
    name: Clean room (empty HOME)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Proves a pass cannot depend on the contributor's own OpenCode config,
      # credentials or installed plugin.
      - name: Verify
        run: npm run verify

  mutations:
    name: Mutation harness
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Reverts each safety property in turn and fails if the suite still passes.
      # This is the only check that proves the tests guard anything.
      - name: Mutate
        run: npm run mutate

  host-survival:
    name: Host survival (real OpenCode)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install OpenCode V2
        run: |
          # The plugin targets the OpenCode V2 API. The default installer script
          # installs OpenCode 1, whose CLI has no `--standalone` flag and whose
          # hook API is different, so installing it would test the wrong program
          # and pass or fail for reasons unrelated to this plugin. V2 ships from
          # its own tap.
          brew install anomalyco/tap/opencode-v2
          opencode --version
      - name: Require OpenCode V2
        run: |
          v="$(opencode --version 2>/dev/null | head -1 | tr -d 'v')"
          major="${v%%.*}"
          if [ "$major" != "2" ]; then
            echo "FATAL: this suite needs OpenCode 2.x, found '${v:-unknown}'" >&2
            exit 1
          fi
      - name: Build the bundle under test
        run: npm run build:server
      # Unit tests call functions. This runs the plugin inside a real OpenCode
      # process in a throwaway HOME and asserts only that OpenCode still answers
      # a prompt when the plugin is broken. It is the check whose absence let
      # 0.6.0 disable the editor while 801 tests passed.
      #
      # The model is a loopback stub started by the script itself, so the run
      # needs no credentials, spends nothing, and cannot be blocked by provider
      # quota. Nothing about the guarantee depends on a third party being up.
      - name: Run the isolated suite
        run: ./scripts/isolated-e2e.sh --timeout 240
